<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPRINT – Pembuat Surat Perintah</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">SPRINT<small>Pembuat Surat Perintah</small></div>
  <nav role="tablist"><button role="tab" id="tab-buat" aria-selected="true">Buat surat</button><button role="tab" id="tab-riwayat" aria-selected="false">Riwayat (<span id="cnt">0</span>)</button></nav>
</header>
<main>
<section class="form" id="formPane" aria-label="Formulir surat perintah">
  <fieldset><legend>Mulai dari contoh</legend>
    <div class="actions" style="padding:0">
      <button class="sm" data-preset="rinci">Contoh 1: data pegawai di surat</button>
      <button class="sm" data-preset="lampiran">Contoh 2: daftar terlampir</button>
    </div>
  </fieldset>
  <fieldset><legend>Kop surat</legend>
    <label for="kementerian">Kementerian / lembaga</label><input id="kementerian" data-k="kementerian">
    <label for="unit">Unit organisasi</label><input id="unit" data-k="unit">
    <label for="alamat">Alamat</label><input id="alamat" data-k="alamat">
    <label for="kontak">Telepon, laman, dan pos-el</label><textarea id="kontak" data-k="kontak" rows="2"></textarea>
    <label for="logo">Logo instansi (opsional)</label><input id="logo" type="file" accept="image/*">
  </fieldset>
  <fieldset><legend>Judul dan pertimbangan</legend>
    <label for="nomor">Nomor surat</label><input id="nomor" data-k="nomor">
    <label for="pejabat">Pejabat yang menerbitkan (kalimat pembuka)</label><input id="pejabat" data-k="pejabat">
    <label>Menimbang (otomatis a, b, c)</label><p class="hint">Tulis *teks miring* dengan tanda bintang.</p>
    <div id="menimbangList"></div><button class="sm" data-add="menimbang">Tambah butir</button>
    <label>Dasar (otomatis 1, 2, 3)</label>
    <div id="dasarList"></div><button class="sm" data-add="dasar">Tambah dasar</button>
  </fieldset>
  <fieldset><legend>Kepada</legend>
    <label for="mode">Cara menampilkan pegawai</label>
    <select id="mode" data-k="mode"><option value="rinci">Rinci di badan surat</option><option value="lampiran">Daftar terlampir (halaman lampiran)</option></select>
    <div id="persList" style="margin-top:10px"></div><button class="sm" data-add="personel">Tambah pegawai</button>
    <label for="kegiatan">Nama kegiatan (judul lampiran)</label><input id="kegiatan" data-k="kegiatan">
  </fieldset>
  <fieldset><legend>Untuk</legend>
    <div id="untukList"></div><button class="sm" data-add="untuk">Tambah butir tugas</button>
  </fieldset>
  <fieldset><legend>Penandatangan</legend>
    <label for="kota">Kota</label><input id="kota" data-k="kota">
    <label for="tanggal">Tanggal surat</label><input id="tanggal" type="date" data-k="tanggal">
    <label for="jabatan">Jabatan</label><input id="jabatan" data-k="jabatan">
    <label for="ttdNama">Nama</label><input id="ttdNama" data-k="ttdNama">
    <label><input type="checkbox" data-c="qr">Tampilkan QR dan catatan tanda tangan elektronik (contoh tampilan)</label>
    <label>Tembusan (opsional)</label>
    <div id="tembusanList"></div><button class="sm" data-add="tembusan">Tambah tembusan</button>
  </fieldset>
  <div class="actions">
    <button class="primary" id="btnPrint">Cetak / simpan PDF</button>
    <button id="btnSave">Simpan ke riwayat</button>
    <button class="danger" id="btnReset">Kosongkan</button>
  </div>
</section>
<section class="stage" id="stage" aria-label="Pratinjau surat"></section>
<section class="hist" id="histPane" hidden><h2>Riwayat surat tersimpan</h2><div id="histList"></div></section>
</main>
<div class="toast" id="toast" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
